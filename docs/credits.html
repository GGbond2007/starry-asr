<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>星空语音识别引擎 · 致谢名单</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    min-height: 100vh;
    background:
      radial-gradient(ellipse 80% 50% at 20% -10%, rgba(120,119,255,.28), transparent),
      radial-gradient(ellipse 60% 40% at 85% 15%, rgba(64,186,255,.22), transparent),
      radial-gradient(ellipse 70% 45% at 50% 110%, rgba(168,85,247,.18), transparent),
      linear-gradient(180deg, #0b0e1d 0%, #10142b 55%, #141936 100%);
    color: #e8eaf6;
    font-family: -apple-system, "PingFang SC", "HarmonyOS Sans SC", "Microsoft YaHei", sans-serif;
    padding: 32px 18px 48px;
    overflow-x: hidden;
  }
  /* 星空背景 */
  .stars { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
  .star { position: absolute; border-radius: 50%; background: #fff; animation: twinkle var(--d,3s) ease-in-out infinite alternate; opacity:.7; }
  @keyframes twinkle { from{opacity:.15} to{opacity:.85} }
  .wrap { position: relative; z-index: 1; max-width: 640px; margin: 0 auto; }

  header { text-align: center; padding: 26px 0 8px; animation: fadeDown .8s ease both; }
  .logo {
    width: 84px; height: 84px; margin: 0 auto 18px; border-radius: 26px;
    background: linear-gradient(135deg,#5b6cff,#a855f7 60%,#40baff);
    display:flex; align-items:center; justify-content:center; font-size:44px;
    box-shadow: 0 10px 42px rgba(91,108,255,.5), inset 0 1px 0 rgba(255,255,255,.35);
    animation: float 4.5s ease-in-out infinite;
  }
  @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-9px)} }
  h1 {
    font-size: 25px; font-weight: 700; letter-spacing: 2px;
    background: linear-gradient(92deg,#9db2ff,#e0c3fc 55%,#7ee0ff);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .subtitle { margin-top: 9px; font-size: 13.5px; color: #8f9bd4; letter-spacing: 5px; }
  .divider {
    width: 66px; height: 3px; margin: 22px auto 30px; border-radius: 99px;
    background: linear-gradient(90deg,#5b6cff,#a855f7);
  }

  .card {
    background: rgba(255,255,255,.055);
    border: 1px solid rgba(255,255,255,.09);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border-radius: 20px; padding: 22px 20px; margin-bottom: 16px;
    transition: transform .25s ease, box-shadow .25s ease, border-color .25s ease;
    animation: fadeUp .7s ease both;
  }
  .card:nth-child(1){animation-delay:.08s} .card:nth-child(2){animation-delay:.18s}
  .card:nth-child(3){animation-delay:.28s} .card:nth-child(4){animation-delay:.38s}
  .card:nth-child(5){animation-delay:.48s}
  .card:active { transform: scale(.98); }
  .card:hover { border-color: rgba(157,178,255,.35); box-shadow: 0 8px 34px rgba(91,108,255,.16); }
  .card.special { border-color: rgba(168,85,247,.4); background: rgba(139,92,246,.09); }
  .row { display:flex; align-items:center; gap:16px; }
  .avatar {
    flex-shrink: 0; width: 56px; height: 56px; border-radius: 17px;
    display:flex; align-items:center; justify-content:center;
    font-size: 27px; font-weight: 700; color:#fff;
  }
  .a1 { background: linear-gradient(135deg,#667eea,#764ba2); box-shadow:0 6px 20px rgba(102,126,234,.45);}
  .a2 { background: linear-gradient(135deg,#f093fb,#f5576c); box-shadow:0 6px 20px rgba(245,87,108,.4);}
  .a3 { background: linear-gradient(135deg,#43e97b,#38f9d7); box-shadow:0 6px 20px rgba(67,233,123,.35);}
  .a4 { background: linear-gradient(135deg,#fa709a,#fee140); box-shadow:0 6px 20px rgba(250,112,154,.4);}
  .info { flex: 1; min-width: 0; }
  .name { font-size: 18.5px; font-weight: 700; letter-spacing: 1px; display:flex; align-items:center; gap:9px; flex-wrap:wrap;}
  .badge {
    font-size: 11px; font-weight: 600; padding: 3px 10px; border-radius: 99px; letter-spacing: 1px;
    background: linear-gradient(90deg,#a855f7,#6366f1); box-shadow: 0 2px 10px rgba(168,85,247,.4);
  }
  .badge.b2 { background: linear-gradient(90deg,#ec4899,#f97316); box-shadow:0 2px 10px rgba(236,72,153,.35);}
  .badge.b3 { background: linear-gradient(90deg,#10b981,#06b6d4); box-shadow:0 2px 10px rgba(16,185,129,.35);}
  .desc { margin-top: 7px; font-size: 13.5px; line-height: 1.75; color: #aab3dd; }

  .thanks-all {
    text-align:center; padding: 24px 18px; animation-delay:.58s !important;
  }
  .thanks-all .emoji { font-size: 34px; }
  .thanks-all p { margin-top: 10px; font-size: 14.5px; color:#aab3dd; line-height: 1.9; }

  /* QQ群加入按钮 */
  .join-btn {
    display:flex; align-items:center; justify-content:center; gap:11px;
    margin: 26px auto 0; max-width: 340px; padding: 16px 20px;
    background: linear-gradient(92deg,#12b7f5,#5b6cff);
    border-radius: 99px; text-decoration: none;
    color:#fff; font-size: 16.5px; font-weight: 700; letter-spacing: 2px;
    box-shadow: 0 10px 32px rgba(18,183,245,.45), inset 0 1px 0 rgba(255,255,255,.3);
    transition: transform .2s ease, box-shadow .2s ease;
    animation: pulse 2.6s ease-in-out infinite;
  }
  @keyframes pulse {
    0%,100%{box-shadow:0 10px 32px rgba(18,183,245,.45)}
    50%{box-shadow:0 10px 44px rgba(18,183,245,.7)}
  }
  .join-btn:active { transform: scale(.96); }
  .join-hint { text-align:center; margin-top: 13px; font-size: 12px; color:#7683b8; letter-spacing: 1px; }

  footer { text-align:center; margin-top: 38px; font-size: 12px; color:#5d6899; letter-spacing: 1.5px; line-height:2;}
  @keyframes fadeUp { from{opacity:0;transform:translateY(26px)} to{opacity:1;transform:none} }
  @keyframes fadeDown { from{opacity:0;transform:translateY(-18px)} to{opacity:1;transform:none} }
</style>
</head>
<body>
<div class="stars" id="stars"></div>
<div class="wrap">
  <header>
    <div class="logo">✨</div>
    <h1>星空语音识别引擎</h1>
    <div class="subtitle">— 特 别 鸣 谢 —</div>
    <div class="divider"></div>
  </header>

  <section class="card special">
    <div class="row">
      <div class="avatar a1">星</div>
      <div class="info">
        <div class="name">星空之主 <span class="badge">前期 AI 主要提供者</span></div>
        <div class="desc">项目起步阶段的核心 AI 支持者，为早期版本的开发提供了主要的技术贡献。</div>
      </div>
    </div>
  </section>

  <section class="card">
    <div class="row">
      <div class="avatar a2">浅</div>
      <div class="info">
        <div class="name">浅念 <span class="badge b2">MSC 插件托管</span></div>
        <div class="desc">提供 MSC 插件的托管服务与文件存储帮助，保障了识别插件的稳定分发。</div>
      </div>
    </div>
  </section>

  <section class="card">
    <div class="row">
      <div class="avatar a3">梦</div>
      <div class="info">
        <div class="name">今梦 <span class="badge b3">无障碍引导</span></div>
        <div class="desc">在无障碍功能的适配过程中提供宝贵的提示和引导，让视障用户也能顺畅使用。</div>
      </div>
    </div>
  </section>

  <section class="card thanks-all">
    <div class="emoji">💙</div>
    <p><b>以及群里的各位小伙伴们</b><br>感谢每一位测试反馈、提出建议、陪伴项目成长的朋友<br>你们的支持是星空前行的动力</p>
  </section>

  <a class="join-btn" href="https://qun.qq.com/universal-share/share?ac=1&authKey=pp%2FRhCYpJzb5vtLHhHEuoTxTKEPMNkobM88cEJvzqiWpik8HdpHP1dojmM%2FNbQN0&busi_data=eyJncm91cENvZGUiOiI5ODA3MzAxNDYiLCJ0b2tlbiI6IitRODR6U3c4Rk9wYmJJSTZSY1F3YlBoMHRTZGY0RGlKWmxsNlcxNENRcTlwd1lRTkxMOFFqZFgwQUxmU2xnWXYiLCJ1aW4iOiIzMzg3MTc2MjcwIn0%3D&data=3S7nw32uSHLdGsCyTwP0pQsfrfQpBXLCoKkmUVBmnSv-x2Uz28MqXEkXT8eX_QQGPQSNyNiisAbSnya_0LuhMQ&svctype=4&tempid=h5_group_info">
    💬 加入交流群
  </a>
  <div class="join-hint">点击加入 QQ 群 · 与开发者和其他用户一起交流</div>

  <footer>
    星空语音识别引擎 · 致谢名单<br>
    每一份贡献都值得被记住 ⭐
  </footer>
</div>
<script>
  // 随机生成闪烁星星
  (function(){
    const box = document.getElementById('stars');
    for (let i = 0; i < 70; i++) {
      const s = document.createElement('div');
      s.className = 'star';
      const size = Math.random() * 2.2 + 0.6;
      s.style.cssText = `left:${Math.random()*100}%;top:${Math.random()*100}%;width:${size}px;height:${size}px;--d:${(Math.random()*2.5+1.6).toFixed(1)}s;animation-delay:${(Math.random()*3).toFixed(1)}s`;
      box.appendChild(s);
    }
  })();
</script>
</body>
</html>
